# GrindstoneSkills.Snags.yml - what a fishing line can snag.
#
# A cast left in the water for "Snag Wait" seconds (section "54 - Catch And Tackle" of the .cfg) without a fish on the
# line may snag something: from "Snag Chance At 0" to "Snag Chance At 100", growing with the angler's Fishing level,
# rolled once per cast. The line then reels in heavy and slow, no fish will bite it, and when it is in, one snag is
# picked from this file by weight for the biome the float was in. Its items go into the angler's inventory (at their
# feet when it is full), and everybody near sees "Found <name>!". The world's resource rate does not change snags.
#
# The server's copy is sent to every player while the server's "Lock Configuration" is on; edits are picked up a few
# seconds after saving, no restart needed. Extra files named GrindstoneSkills.Snags<anything>.yml next to this one are
# read as well; a biome in a later file replaces the same biome in an earlier file.
#
# LAYOUT
#
#   biomes:            one list of snags per biome. A float uses the list of the biome it floats in.
#     <Biome>:         Meadows, BlackForest, Swamp, Mountain, Plains, Mistlands, AshLands, DeepNorth or Ocean
#                      (case does not matter, "Black Forest" works too). A biome that is not listed, or listed with
#                      nothing after the colon ("Swamp:"), snags only weeds.
#
# Each snag in a list:
#   name:    what the messages show after "Landed" and "Found", for example "a silver necklace". Optional,
#            "something" if left out.
#   weight:  how often it is picked compared with the other snags of the same list: weight 20 next to weights that
#            add up to 100 is picked one time in five. Optional, 1 if left out; 0 switches the snag off.
#   items:   one or more items that all come in together, each { prefab: <item>, min: <n>, max: <n> }:
#              prefab  the item's prefab name as the game spells it: Coins, Amber, SilverNecklace, IronScrap...
#                      A name the game does not know is logged once and skipped.
#              min     the fewest that come, 0 or more. Optional, 1 if left out.
#              max     the most that come, at least min, at most 999. Optional, the same as min if left out.
#
# The lists below hold what sinks where: lost coins and trinkets everywhere, and the biome's own leftovers, a little
# richer the further the biome is along the game's progression and richest at sea. Keep the two-space indents: a biome
# sits two spaces in from "biomes:", each snag starts with "- " four spaces in.

biomes:
  Meadows:
    - name: a few lost coins
      weight: 30
      items:
        - { prefab: Coins, min: 5, max: 15 }
    - name: a lump of resin
      weight: 25
      items:
        - { prefab: Resin, min: 2, max: 4 }
    - name: some leather scraps
      weight: 20
      items:
        - { prefab: LeatherScraps, min: 2, max: 4 }
    - name: a few flints
      weight: 20
      items:
