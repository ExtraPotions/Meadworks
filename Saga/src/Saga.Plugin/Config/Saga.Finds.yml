# GrindstoneSkills.Finds.yml - what a felled tree can hide.
#
# When a woodcutter fells a tree (a domino fell counts too), there is a chance of a find: from "Find Chance At 0" to
# "Find Chance At 100" in section "13 - Finds" of the .cfg, growing with the woodcutter's Woodcutting level. One find
# is then picked from this file by weight, its items drop a few metres up the trunk and tumble out of the crown, and
# everybody near sees "Found <name>!" above the tree.
#
# The server's copy is sent to every player while the server's "Lock Configuration" is on; edits are picked up a few
# seconds after saving, no restart needed. Extra files named GrindstoneSkills.Finds<anything>.yml next to this one are
# read as well; a biome or tree in a later file replaces the same one in an earlier file.
#
# LAYOUT
#
#   biomes:            one list of finds per biome. A tree uses the list of the biome it stands in.
#     <Biome>:         Meadows, BlackForest, Swamp, Mountain, Plains, Mistlands, AshLands, DeepNorth or Ocean
#                      (case does not matter, "Black Forest" works too). A biome that is not listed, or listed with
#                      nothing after the colon ("Swamp:"), hides nothing.
#   trees:             optional: one list of finds per tree prefab. A listed tree uses its own list instead of its
#     <TreePrefab>:    biome's, wherever it grows. The game's trees: Beech1, Oak1, Birch1, Birch2, Birch1_aut,
#                      Birch2_aut, FirTree, Pinetree_01, SwampTree1, YggaShoot1, YggaShoot2, YggaShoot3,
#                      AshlandsTree1, AshlandsTree3, AshlandsTree4, AshlandsTree5, AshlandsTree6, AshlandsTree6_big,
#                      FirTree_big, SnowFirTree, Pinetree_Snow, Pinetree_Snow_dead. Trees added by other mods work
#                      too, by their prefab name.
#
# Each find in a list:
#   name:    what the callout shows after "Found", for example "a bird's nest". Optional, "something" if left out.
#   weight:  how often it is picked compared with the other finds of the same list: weight 20 next to weights that
#            add up to 100 is picked one time in five. Optional, 1 if left out; 0 switches the find off.
#   items:   one or more items that all drop together, each { prefab: <item>, min: <n>, max: <n> }:
#              prefab  the item's prefab name as the game spells it: Feathers, Honey, QueenBee, Coins, Amber...
#                      A name the game does not know is logged once and skipped.
#              min     the fewest that drop, 0 or more. Optional, 1 if left out.
#              max     the most that drop, at least min, at most 999. Optional, the same as min if left out.
#
# To add a biome or a tree, copy one of the lists below under a new key and change it. Keep the two-space indents:
# a biome sits two spaces in from "biomes:", each find starts with "- " four spaces in.

biomes:
  Meadows:
    - name: a bird's nest
      weight: 40
      items:
        - { prefab: Feathers, min: 2, max: 4 }
    - name: a wild hive
      weight: 20
      items:
        - { prefab: Honey, min: 2, max: 4 }
    - name: a queen bee's hive
      weight: 2
      items:
        - { prefab: Honey, min: 1, max: 3 }
        - { prefab: QueenBee, min: 1, max: 1 }
    - name: a squirrel's stash
      weight: 15
      items:
