# EliteCrafting - inscriptions
format: 3
#
# Every inscription the mod can roll, which item classes it rolls on, and its tier ladder.
# Written once, on first run, as a full copy of the built-in defaults; the mod never
# rewrites it (a file from an older format is renamed to .v<format>.bak and written fresh). The
# built-in defaults stay underneath this file (set `use_defaults: false` to make the files
# the whole configuration), so an entry you delete here comes back from the defaults: turn
# an inscription off with `enabled: false` instead (existing copies go dormant), or stop it
# rolling with `weight: 0` (existing copies keep working).
#
# Extra files named EliteCrafting_inscriptions_<anything>.yml are read after this one, in
# file-name order. An entry there with an existing id changes only the fields it names; a
# new id adds an inscription. Lists (classes.best, classes.allowed, tier rows) are replaced whole.
#
# Fields: id, name, effect, param, value (percent | flat | flag), unit (ms | deg | m | min,
# flat only), affix (prefix | suffix), family, category (offense | defense | utility),
# classes { best: [...], allowed: [...] } (item class ids, see `classes` in the economy file),
# requires { skill, hands, traits }, condition (none | health_critical), exclusion_group,
# scaled (true: the value is multiplied by the item class's damage_scale when it rolls),
# weight (default 100), enabled, hook (easy | medium | hard), tiers.
#
# Tiers count down: T1 is the strongest. An item rolls any tier its item level has unlocked
# (item level = the biome of its materials, 1 Meadows ... 8 Deep North), weaker tiers more
# often (a tier's weight is its number unless a row says otherwise). On a class where the
# inscription is only `allowed`, the top third of its tiers is closed
# (`rolling.allowed_closed_fraction` in the economy file).
#   tiers: { count: 8, from: 1, min: 3, max: 40 }
#     a ladder: `count` tiers, the weakest unlocked at item level `from`, the strongest at 8,
#     values spread from `min` (the weakest tier's low end) to `max` (the strongest's high end).
#   tiers: [ { tier: 1, level: 8, min: 37, max: 40, weight: 1 }, ... ]
#     explicit rows instead. A flag inscription has no min and max.
#
# Rarity limits (economy file): Magic holds 2 (1 prefix and 1 suffix), Rare 3 (at most 2 of each);
# the Serpent Rune can add one more, to 4 at most.

# Health-critical: at or below this percent of maximum health the health_critical
# inscriptions apply. The threshold inscription raises it, never past max_threshold.
health_critical:
  threshold: 30
  max_threshold: 50

# Caps on the summed total of a channel across everything you wear. Keys: effect,
# effect:param, effect@health_critical, effect:param@health_critical. `null` removes a cap.
