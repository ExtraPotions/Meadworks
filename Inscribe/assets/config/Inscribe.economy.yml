  #   forge: { 1: 2, 3: 3, 5: 4, 7: 5 }

# Biome -> tier, for creatures and (later) chests that have no entry of their own.
biomes:
  meadows: 1
  black_forest: 2
  swamp: 3
  mountain: 4
  plains: 5
  mistlands: 6
  ashlands: 7
  ocean: 4                     # judgement call
  deep_north: 8

# What creatures drop. The on/off switches are `Rune Drops` and `Magic Item Drops` in Inscribe's
# settings (4 - Drops); Inscribe keeps EliteCrafting 0.7.0's magic gear drops.
drops:
  tamed: false                 # tamed creatures drop our loot
  require_player: true         # a player (or a player's tamed creature) must have hit it
  max_runes_per_kill: 5
  max_gear_per_kill: 2
  star_multipliers: [1, 2, 3]  # by stars; index 0 = no stars
  star_step: 1                 # added per star beyond the list

  chances:                     # base chance per kill, by tier
    rune: [15, 19, 22, 26, 29, 33, 36, 40]   # Inscribe (user, 2026-10-10): 15-40% a kill; EliteCrafting 0.9.1 is 35-70%
    gear: [1, 1.25, 1.5, 1.75, 2, 2.25, 2.5, 2.75]

  runes:                       # which rune drops, by tier; a disabled rune never drops
    # Each column adds to 100, so a weight is that rune's percent of the drops at the tier. Ascension holds the old
    # Awakening and Ascension shares and Honing the old Honing and Tempering shares (2026-10-19), so the columns and the
    # other runes' odds are unchanged.
    #               T1  T2  T3  T4  T5  T6  T7  T8
    ascension:     [37, 36, 33, 31, 28, 26, 24, 21]
    recasting:     [48, 45, 43, 42, 40, 40, 38, 38]
    honing:        [ 2,  5,  7,  8, 10, 10, 12, 12]
    cleansing:     [ 3,  3,  3,  3,  4,  4,  4,  5]
    serpent:       [ 0,  0,  2,  3,  4,  5,  6,  7]
    # The Dvergr Chisel; with `Gems and sockets` off its share goes to the runes. Gems drop only from bosses
    # (50% for one, plus 50% for one more per boss star; fixed in code).
    dvergr_chisel: [10, 11, 12, 13, 14, 15, 16, 17]

  rarity_weights:              # the rarity of dropped gear, by tier
    #          T1  T2  T3  T4  T5  T6  T7  T8
    magic:   [ 80, 70, 60, 50, 45, 40, 35, 30]
    rare:    [ 20, 30, 40, 50, 55, 60, 65, 70]
    mw_epic: [  0,  1,  2,  3,  5,  6,  8, 10]
    # mw_legendary is source_only: it has no row here and never drops from creatures or chests.

  boss_rarity_weights:
    magic:   [ 40, 30, 20, 15, 10,  5,  0,  0]
    rare:    [ 60, 70, 80, 85, 90, 95, 100, 100]
    mw_epic: [  5,  8, 10, 12, 15, 18, 20, 25]

  gear:
    require_recipe: true       # only bases a player could craft
    tiers_below: 1             # bases this many tiers below the drop tier may drop too
    same_tier_weight: 3
    lower_tier_weight: 1
    exclude: []                # item prefabs that never drop
    include: {}                # item prefab -> tier, always in the pool at that tier

  bosses:                      # every boss may also drop gems and the Dvergr Chisel 25% (fixed in code)
    Eikthyr:
      tier: 1
      rune_rolls: 2
      gear_rolls: 1
      bonus:
        - { rune: ascension, chance: 100, amount: 2 }
        - { rune: recasting, chance: 100, amount: 1 }
    gd_king:
      tier: 2
      rune_rolls: 2
      gear_rolls: 1
      bonus:
        - { rune: ascension, chance: 100, amount: 1 }
    Bonemass:
      tier: 3
      rune_rolls: 3
      gear_rolls: 1
      bonus:
        - { rune: serpent, chance: 50, amount: 1 }
        - { rune: ascension, chance: 50, amount: 1 }
    Dragon:
      tier: 4
      rune_rolls: 3
      gear_rolls: 1
      bonus:
        - { rune: ascension, chance: 100, amount: 1 }
    GoblinKing:
      tier: 5
      rune_rolls: 4
      gear_rolls: 1
      bonus:
        - { rune: ascension, chance: 100, amount: 1 }
        - { rune: serpent, chance: 25, amount: 1 }
    SeekerQueen:
      tier: 6
      rune_rolls: 4
      gear_rolls: 1
      bonus:
        - { rune: ascension, chance: 100, amount: 2 }
    Fader:                     # verify prefab name
      tier: 7
      rune_rolls: 5
      gear_rolls: 1
      bonus:
        - { rune: ascension, chance: 100, amount: 2 }
        - { rune: serpent, chance: 50, amount: 1 }
    FrozenKing_p3:             # Kall Fimbulbringer's last phase; FrozenKing and FrozenKing_p2 are earlier phases
      tier: 8
      rune_rolls: 6
      gear_rolls: 1
      bonus:
        - { rune: ascension, chance: 100, amount: 2 }
        - { rune: serpent, chance: 75, amount: 1 }

  # Per creature prefab: tier override, multipliers and bonus runes. Examples:
  #   Troll:   { rune_multiplier: 2 }                                   # trolls pay double runes
  #   Hen:     { multiplier: 0 }                                        # never drops our loot
  #   Wolf:    { tier: 4, bonus: [ { rune: serpent, chance: 20, amount: 1 } ] }
  creatures: {}

  # World containers the game fills with default loot (dungeon and ruin chests, buried treasure) roll once, when the
  # game fills them: chances in percent per container, the tier of the biome at the container (dungeons: the surface
  # biome), the same rune and rarity tables and per-kill caps as creatures. Player-built chests never roll; containers
  # generated before the mod was installed were filled then and do not roll.
  chests:
    rune_chance: 25            # Inscribe: half of EliteCrafting 0.9.1's 50%, as the kill chances
    gear_chance: 10

  # Elite Creatures Reborn (read only where ECR is installed; ecr-integration.md). With the .cfg switch
  # "8 - Elite Creatures Reborn / Synergy" on, ECR's elite stars replace the game level on their own table below.
  # The tier lists are indexed by ECR's world tier (0-7); ECR does not record one yet, so they do nothing until it does.
  # skip_worthless applies whenever ECR is installed, switch or not: its Cloven twin and Phantom husks drop nothing here.
  ecr:
    star_multipliers: [1, 1, 1.5, 2, 2.5, 3]   # by ECR stars; index 0 = no stars
    star_step: 0.5                             # added per star beyond the list
    star_rarity_bonus: 0                       # percent per ECR star on gear rarities above Magic
    tier_rune_multipliers: [1, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7]
    tier_rarity_bonus:      [0, 5, 10, 15, 20, 25, 30, 35]
    skip_worthless: true

