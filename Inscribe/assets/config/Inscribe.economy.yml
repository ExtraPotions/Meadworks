# EliteCrafting - economy
#
# Rarities, rolling rules, runes, item classes, item tiers, biome tiers and drop tables.
format: 3
# Written once, on first run, as a full copy of the built-in defaults; the mod never
# rewrites it (a file from an older format is renamed to .v<format>.bak and written fresh). The
# built-in defaults stay underneath this file (set
# `use_defaults: false` to make the files the whole configuration).
#
# Extra files named EliteCrafting_economy_<anything>.yml are read after this one, in
# file-name order, and change only what they name:
#   - rarities and runes merge by `id`, field by field;
#   - maps (cost, weights, item_tiers.*, biomes, drops.runes, drops.bosses, ...)
#     merge by key; a key set to null is removed;
#   - classes merge by `id`, field by field;
#   - lists (applies_to, items, outcomes, a rune's drop weights) are replaced whole.
#
# Chances are percent numbers (4 means 4%). Weights are relative. Lists indexed by
# tier have eight entries: tier 1 (meadows) first, tier 8 (deep north) last. A list of
# seven still loads; its last value then counts for tier 8 too.

# The ladder, lowest first. The first entry is the base rarity (no inscriptions, never
# glows). `drop_weight` multiplies the rarity's weight in every drop table; 0 means it
# never drops.
rarities:
  - id: normal
    color: "#FFFFFF"
    glow: false
    inscriptions: { min: 0, max: 0 }
    drop_weight: 0
  - id: magic
    color: "#1EFF00"
    inscriptions: { min: 2, max: 2 }
    prefixes: 1                # at most this many prefix inscriptions
    suffixes: 1
  - id: rare
    color: "#0070DD"
    inscriptions: { min: 3, max: 3 }
    prefixes: 2
    suffixes: 2
  # MeadWorks tiers (batch 3). Shown names: normal Common, magic Uncommon, rare Rare, mw_epic Epic, mw_legendary
  # Legendary; the stored ids never change. `tier_floor` keeps only the best that-many open tiers when an item is rolled
  # fresh at the rarity (as a rune's tier_floor does). `source_only: true` never drops from creatures or chests, never
  # comes from a rune or a promotion: only Wildblood bosses and raids hand it out (meadworks.inscribe.legendary_reward).
  - id: mw_epic
    color: "#A335EE"
    inscriptions: { min: 4, max: 4 }
    prefixes: 2
    suffixes: 2
    tier_floor: 4
  - id: mw_legendary
    color: "#FFB400"
    inscriptions: { min: 5, max: 5 }
    prefixes: 3
    suffixes: 3
    tier_floor: 2
    drop_weight: 0
    source_only: true

# How inscriptions are drawn. Each item has an item level (1 meadows ... 8 deep north, see
# item_tiers) and an item class (see classes). An inscription rolls on the classes it lists,
# at any tier the item level has unlocked, weaker tiers more often; on a class where it is
# only `allowed`, the top `allowed_closed_fraction` of its tiers stays closed (0.334: health
# on a helmet stops at T3 of 8). A promotion (the Ascension Rune) adds what the new
# rarity's minimum needs, and at least `promote_adds_at_least`. `count_weights` biases how
# many inscriptions a fresh roll (a dropped item) gets.
rolling:
  allowed_closed_fraction: 0.334
  promote_adds_at_least: 1

# The five runes. Click a rune onto an item in your own inventory. Fields: id (one of the five),
# verb, applies_to (rarities), cost (per rarity, default 1), tier_floor, enabled,
# confirm (hold Shift / dialog first), stack (default 50), item_weight (the item weight of
# one rune, default 0.2), name, description (loc key or text), tint.
# Verbs: promote (one rarity up), reroll (every inscription replaced: the item rolled fresh at its rarity, a new count in its range),
# strip (back to the base rarity, every inscription gone), corrupt (one outcome, then the
# item is sealed for good: no rune works on it again). `tier_floor` is the weakest
# inscription tier the rune rolls, counted like the tooltip: 1 = the best tier the item
# allows. enabled: false keeps a rune from dropping and from being used; its prefab (and
# every stack of it) stays. The Awakening and Tempering Runes were folded into Ascension and Honing (2026-10-19): rows,
# drop weights and boss bonuses that still name them are read as their successor, and owned stacks convert one for one.
runes:
  # One rarity step at any tier: Common -> Uncommon (two inscriptions), Uncommon -> Rare and Rare -> Epic (one more each).
  # Never into Legendary, which only Wildblood bosses and raids hand out.
  - { id: ascension,   verb: promote, applies_to: [normal, magic, rare] }
  - { id: recasting,   verb: reroll,  applies_to: [magic] }        # both inscriptions replaced by two new
  # MeadWorks (batch 3): one inscription the player picks, one tier stronger (never past the best tier the item's level
  # opens), its value rolled again in that tier. Flags have no value and refuse it.
  - { id: honing,      verb: hone,    applies_to: [magic, rare, mw_epic, mw_legendary] }
  - id: cleansing                                                  # back to Normal
    verb: strip
    applies_to: [magic, rare, mw_epic, mw_legendary]
    confirm: true
  - id: serpent                                                    # sealed for good, one of three outcomes
    verb: corrupt
    applies_to: [magic, rare, mw_epic, mw_legendary]
    confirm: true
    overflow: 1                # add_inscription may go this many past the rarity's maximum
    outcomes:
      - { outcome: seal_only,       weight: 35 }   # sealed as it is
      - { outcome: add_inscription, weight: 35 }   # one more inscription, past the cap
      - { outcome: chaotic_reroll,  weight: 30 }   # every inscription rerolled at any tier
  # Sockets and gems (switch `Gems and sockets`): the Dvergr Chisel cuts 1-3 sockets into a weapon,
  # pickaxe, staff, armour piece, shield or backpack that has none; a gem fills a socket with a stat that depends on
  # the item (fixed in code), its tier rolled for the item when it is set.
  - { id: dvergr_chisel, verb: socket, applies_to: [normal, magic, rare, mw_epic, mw_legendary] }
  - { id: gem_surtr,     verb: gem, applies_to: [normal, magic, rare, mw_epic, mw_legendary] }
  - { id: gem_ymir,      verb: gem, applies_to: [normal, magic, rare, mw_epic, mw_legendary] }
  - { id: gem_thor,      verb: gem, applies_to: [normal, magic, rare, mw_epic, mw_legendary] }
  - { id: gem_nidhogg,   verb: gem, applies_to: [normal, magic, rare, mw_epic, mw_legendary] }
  - { id: gem_hel,       verb: gem, applies_to: [normal, magic, rare, mw_epic, mw_legendary] }
  - { id: gem_tyr,       verb: gem, applies_to: [normal, magic, rare, mw_epic, mw_legendary] }
  - { id: gem_freyja,    verb: gem, applies_to: [normal, magic, rare, mw_epic, mw_legendary] }
  - { id: gem_odin,      verb: gem, applies_to: [normal, magic, rare, mw_epic, mw_legendary] }
  - { id: gem_skadi,     verb: gem, applies_to: [normal, magic, rare, mw_epic, mw_legendary] }
  - { id: gem_heimdall,  verb: gem, applies_to: [normal, magic, rare, mw_epic, mw_legendary] }
  - { id: gem_sleipnir,  verb: gem, applies_to: [normal, magic, rare, mw_epic, mw_legendary] }

# Item classes: what an item is, for inscriptions (each inscription lists the classes it rolls
# on) and gear drops. An item belongs to the first class that names it in `items`; otherwise
# to the first class, in this order, with a `match` rule it meets. A rule meets when every key
# it has holds: types (the game's item types), skills, two_handed, stackable, prefixes (of the
# prefab name), name_contains. PackPanel's backpacks match no rule; a class must list them, or
# a mod must claim them through the API. `rolls: false` classes never become magic.
# Fields: id, group, name, rolls, damage_scale (multiplies scaled inscriptions such as
# +X fire damage), drop_weight (gear drops), match (a list of rules, any of them), items.
classes:
  - id: unused
    group: none
    rolls: false
    match:
      - { prefixes: [FW_, SP_, DvergerArbalest_] }
    items: [PlayerUnarmed, SwordCheat, SledgeCheat, ShieldKnight, CapeTest, IceShoes, IceSkates, SwordIronFire, DvergerArbalest]
  - id: throwable
    group: none
    rolls: false
    match:
      - { stackable: true }
      - { prefixes: [Bomb, Snowball] }
  - id: tankard
    group: none
    rolls: false
    match:
      - { prefixes: [Tankard] }
  - id: practice
    group: none
    rolls: false
    items: [AtgeirWood, AxeWood, BattleaxeWood, KnifeWood, MaceWood, SledgeWood, SpearWood, SwordWood, THSwordWood]
  - id: cosmetic
    group: none
    rolls: false
    items: [ArmorDress1, ArmorDress10, ArmorDress2, ArmorDress3, ArmorDress4, ArmorDress5, ArmorDress6, ArmorDress7, ArmorDress8, ArmorDress9, ArmorHarvester1, ArmorHarvester2, ArmorTunic1, ArmorTunic10, ArmorTunic2, ArmorTunic3, ArmorTunic4, ArmorTunic5, ArmorTunic6, ArmorTunic7, ArmorTunic8, ArmorTunic9, CapeOdin, HelmetCelebration, HelmetHat1, HelmetHat10, HelmetHat2, HelmetHat3, HelmetHat4, HelmetHat5, HelmetHat6, HelmetHat7, HelmetHat8, HelmetHat9, HelmetMidsummerCrown, HelmetOdin, HelmetPointyHat, HelmetRootCrown, HelmetStrawHat, HelmetSweatBand, HelmetYule]
  - id: helmet
    group: armour
    match:
      - { types: [Helmet] }
  - id: chest
    group: armour
    match:
      - { types: [Chest] }
  - id: legs
    group: armour
    match:
      - { types: [Legs] }
  - id: cape
    group: armour
    match:
      - { types: [Shoulder] }
  - id: trinket
    group: jewel
    match:
      - { types: [Trinket] }
  # Inscribe: the backpack class a pack product (Mantle) claims its packs into through meadworks.items.classes;
  # rune-made magic and sockets only, never a pre-rolled drop (EliteCrafting 0.10.0's PackPanel class, built in).
  - id: backpack
    group: jewel
    drop_weight: 0
  - id: utility
    group: jewel
    drop_weight: 0.5
    match:
      - { types: [Utility] }
  - id: buckler
    group: offhand
    match:
      - { types: [Shield], name_contains: [Buckler] }
  - id: tower
    group: offhand
    match:
      - { types: [Shield], name_contains: [Tower] }
  - id: shield
    group: offhand
    match:
      - { types: [Shield] }
  - id: light
    group: offhand
    damage_scale: 0.5
    drop_weight: 0.25
    match:
      - { types: [Torch] }
  - id: tool
    group: tools
    drop_weight: 0.5
    match:
      - { types: [Tool] }
    items: [Scythe, Shovel, KnifeButcher, GrapplingHook]
  - id: fishing
    group: tools
    drop_weight: 0.25
    items: [FishingRod]
  - id: pickaxe
    group: tools
    match:
      - { skills: [Pickaxes] }
  - id: crossbow
    group: ranged
    damage_scale: 1.4
    match:
      - { skills: [Crossbows] }
  - id: bow
    group: ranged
    damage_scale: 0.6
    match:
      - { skills: [Bows] }
  - id: staff_elemental
    group: magic
    match:
      - { skills: [ElementalMagic] }
  - id: staff_blood
    group: magic
    match:
      - { skills: [BloodMagic] }
  - id: knife
    group: onehand
    damage_scale: 0.7
    match:
      - { skills: [Knives] }
  - id: spear
    group: onehand
    match:
      - { skills: [Spears] }
  - id: atgeir
    group: twohand
    damage_scale: 1.3
    match:
      - { skills: [Polearms] }
  - id: fist
    group: twohand
    damage_scale: 0.7
    match:
      - { skills: [Unarmed] }
  - id: greatsword
    group: twohand
    damage_scale: 1.3
    match:
      - { skills: [Swords], two_handed: true }
  - id: sword_1h
    group: onehand
    match:
      - { skills: [Swords] }
  - id: dual_axe
    group: twohand
    damage_scale: 0.8
    match:
      - { skills: [Axes], prefixes: [AxeBerzerkr, AxeEarly] }
  - id: battleaxe
    group: twohand
    damage_scale: 1.3
    match:
      - { skills: [Axes], two_handed: true }
  - id: axe_1h
    group: onehand
    match:
      - { skills: [Axes] }
  - id: sledge
    group: twohand
    damage_scale: 1.3
    match:
      - { skills: [Clubs], two_handed: true }
  - id: mace_1h
    group: onehand
    match:
      - { skills: [Clubs] }

# The item level of each item (1 meadows ... 8 deep north): an explicit entry in
# `items` wins; otherwise the highest tier among its recipe's materials (crafted
# intermediates followed `material_depth` deep; the lowest of several recipes);
# otherwise its crafting station; otherwise `fallback_tier`. Names that match no
# prefab are ignored with a warning, so one map can serve several modpacks.
# `ecraft tiers` lists every item with its tier and why.
item_tiers:
  fallback_tier: 1
  material_depth: 3

  items:                       # no recipe, or a recipe whose materials mislead
    BeltStrength: 3
    HelmetDverger: 6
    FishingRod: 1
    Wishbone: 3
