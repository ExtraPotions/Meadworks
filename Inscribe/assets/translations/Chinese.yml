ecf_stone_gem_freyja: "芙蕾雅的宝石"
ecf_stone_gem_freyja_desc: "镶入插槽。武器：生命吸取。法杖：更低的生命消耗。护甲、盾牌或背包：更多生命值。阶级按该物品随机。"
ecf_stone_gem_heimdall: "海姆达尔的宝石"
ecf_stone_gem_heimdall_desc: "镶入插槽。武器：致命一击几率。法杖：施法更快。护甲、盾牌或背包：有几率躲开攻击。阶级按该物品随机。"
ecf_stone_gem_hel: "海拉的宝石"
ecf_stone_gem_hel_desc: "镶入插槽。武器：附加精神伤害。法杖：击杀时获得埃达之力。护甲、盾牌或背包：减少受到的精神伤害。阶级按该物品随机。"
ecf_stone_gem_nidhogg: "尼德霍格的宝石"
ecf_stone_gem_nidhogg_desc: "镶入插槽。武器：附加蛊毒伤害。法杖：更久的持续伤害。护甲、盾牌或背包：减少受到的蛊毒伤害。阶级按该物品随机。"
ecf_stone_gem_odin: "奥丁的宝石"
ecf_stone_gem_odin_desc: "镶入插槽。武器：汲取埃达之力。法杖：埃达之力恢复。护甲、盾牌或背包：更多埃达之力。阶级按该物品随机。"
ecf_stone_gem_skadi: "斯卡迪的宝石"
ecf_stone_gem_skadi_desc: "镶入插槽。武器：耐力吸取。法杖：更坚韧的召唤物。护甲、盾牌或背包：更多耐力。阶级按该物品随机。"
ecf_stone_gem_sleipnir: "斯莱普尼尔的宝石"
ecf_stone_gem_sleipnir_desc: "镶入护甲、盾牌或背包的插槽：移动更快。不能镶入武器或法杖。阶级按该物品随机。"
ecf_stone_gem_surtr: "史尔特尔的宝石"
ecf_stone_gem_surtr_desc: "镶入插槽。武器：附加火焰伤害。法杖：元素伤害。护甲、盾牌或背包：减少受到的火焰伤害。阶级按该物品随机。"
ecf_stone_gem_thor: "托尔的宝石"
ecf_stone_gem_thor_desc: "镶入插槽。武器：附加闪电伤害。法杖：连锁闪电。护甲、盾牌或背包：减少受到的闪电伤害。阶级按该物品随机。"
ecf_stone_gem_tyr: "提尔的宝石"
ecf_stone_gem_tyr_desc: "镶入插槽。武器：更多物理伤害。法杖：更强的召唤物。护甲、盾牌或背包：更少踉跄。阶级按该物品随机。"
ecf_stone_gem_ymir: "伊米尔的宝石"
ecf_stone_gem_ymir_desc: "镶入插槽。武器：附加冰霜伤害。法杖：更低的埃达之力消耗。护甲、盾牌或背包：减少受到的冰霜伤害。阶级按该物品随机。"
