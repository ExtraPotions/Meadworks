# EliteCrafting - sockets and gems (sockets.md): the Dvergr Chisel and the eleven gems, their refusals, feedback, the
# replace dialog and the tooltip lines. Key without the $ -> text. $1, $2, $3 are the game's placeholders, filled with
# already-localized words.

ecf_stone_dvergr_chisel: "Dvergr Chisel"
ecf_stone_dvergr_chisel_desc: "Cuts one to three sockets into a weapon, staff, armor piece, shield or backpack that has none, two or three more often on Rare items. Gems go into sockets."

ecf_stone_gem_surtr: "Surtr's Gem"
ecf_stone_gem_surtr_desc: "Set into a socket. Weapon: added fire damage. Staff: elemental damage. Armor, shield or backpack: less fire damage taken. Its tier is rolled for the item."
ecf_stone_gem_ymir: "Ymir's Gem"
ecf_stone_gem_ymir_desc: "Set into a socket. Weapon: added frost damage. Staff: lower eitr cost. Armor, shield or backpack: less frost damage taken. Its tier is rolled for the item."
ecf_stone_gem_thor: "Thor's Gem"
ecf_stone_gem_thor_desc: "Set into a socket. Weapon: added lightning damage. Staff: chain lightning. Armor, shield or backpack: less lightning damage taken. Its tier is rolled for the item."
ecf_stone_gem_nidhogg: "Nidhogg's Gem"
ecf_stone_gem_nidhogg_desc: "Set into a socket. Weapon: added poison damage. Staff: longer damage over time. Armor, shield or backpack: less poison damage taken. Its tier is rolled for the item."
ecf_stone_gem_hel: "Hel's Gem"
ecf_stone_gem_hel_desc: "Set into a socket. Weapon: added spirit damage. Staff: eitr on kill. Armor, shield or backpack: less spirit damage taken. Its tier is rolled for the item."
ecf_stone_gem_tyr: "Tyr's Gem"
ecf_stone_gem_tyr_desc: "Set into a socket. Weapon: more physical damage. Staff: stronger summons. Armor, shield or backpack: less stagger. Its tier is rolled for the item."
ecf_stone_gem_freyja: "Freyja's Gem"
ecf_stone_gem_freyja_desc: "Set into a socket. Weapon: life leech. Staff: lower health cost. Armor, shield or backpack: more health. Its tier is rolled for the item."
ecf_stone_gem_odin: "Odin's Gem"
ecf_stone_gem_odin_desc: "Set into a socket. Weapon: eitr leech. Staff: eitr regeneration. Armor, shield or backpack: more eitr. Its tier is rolled for the item."
ecf_stone_gem_skadi: "Skadi's Gem"
ecf_stone_gem_skadi_desc: "Set into a socket. Weapon: stamina leech. Staff: tougher summons. Armor, shield or backpack: more stamina. Its tier is rolled for the item."
ecf_stone_gem_heimdall: "Heimdall's Gem"
ecf_stone_gem_heimdall_desc: "Set into a socket. Weapon: critical hit chance. Staff: faster casting. Armor, shield or backpack: a chance to avoid hits. Its tier is rolled for the item."
ecf_stone_gem_sleipnir: "Sleipnir's Gem"
ecf_stone_gem_sleipnir_desc: "Set into a socket of armor, a shield or a backpack: faster movement. It does not fit weapons or staves. Its tier is rolled for the item."

