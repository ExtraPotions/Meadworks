ecf_stone_dvergr_chisel: "Dvergar-Meißel"
ecf_stone_dvergr_chisel_desc: "Schneidet einen bis drei Sockel in eine Waffe, einen Stab, ein Rüstungsteil, einen Schild oder einen Rucksack ohne Sockel. Zwei oder drei sind bei Selten-Gegenständen häufiger. Edelsteine kommen in Sockel."
ecf_stone_gem_freyja: "Freyjas Edelstein"
ecf_stone_gem_freyja_desc: "Wird in einen Sockel gesetzt. Waffe: Lebensentzug. Stab: geringere Gesundheitskosten. Rüstung, Schild oder Rucksack: mehr Gesundheit. Die Stufe wird für den Gegenstand gewürfelt."
ecf_stone_gem_heimdall: "Heimdalls Edelstein"
ecf_stone_gem_heimdall_desc: "Wird in einen Sockel gesetzt. Waffe: Chance auf einen kritischen Treffer. Stab: schnelleres Wirken. Rüstung, Schild oder Rucksack: eine Chance, Treffer zu vermeiden. Die Stufe wird für den Gegenstand gewürfelt."
ecf_stone_gem_hel: "Hels Edelstein"
ecf_stone_gem_hel_desc: "Wird in einen Sockel gesetzt. Waffe: zusätzlicher Geistschaden. Stab: Eitr beim Töten. Rüstung, Schild oder Rucksack: weniger erlittener Geistschaden. Die Stufe wird für den Gegenstand gewürfelt."
ecf_stone_gem_nidhogg: "Nidhöggs Edelstein"
ecf_stone_gem_nidhogg_desc: "Wird in einen Sockel gesetzt. Waffe: zusätzlicher Giftschaden. Stab: längerer Schaden über Zeit. Rüstung, Schild oder Rucksack: weniger erlittener Giftschaden. Die Stufe wird für den Gegenstand gewürfelt."
ecf_stone_gem_odin: "Odins Edelstein"
ecf_stone_gem_odin_desc: "Wird in einen Sockel gesetzt. Waffe: Eitr-Entzug. Stab: Eitr-Regeneration. Rüstung, Schild oder Rucksack: mehr Eitr. Die Stufe wird für den Gegenstand gewürfelt."
ecf_stone_gem_skadi: "Skadis Edelstein"
ecf_stone_gem_skadi_desc: "Wird in einen Sockel gesetzt. Waffe: Ausdauerentzug. Stab: zähere Beschwörungen. Rüstung, Schild oder Rucksack: mehr Ausdauer. Die Stufe wird für den Gegenstand gewürfelt."
ecf_stone_gem_sleipnir: "Sleipnirs Edelstein"
ecf_stone_gem_sleipnir_desc: "Wird in einen Sockel von Rüstung, Schild oder Rucksack gesetzt: schnellere Bewegung. Passt nicht in Waffen oder Stäbe. Die Stufe wird für den Gegenstand gewürfelt."
ecf_stone_gem_surtr: "Surtrs Edelstein"
ecf_stone_gem_surtr_desc: "Wird in einen Sockel gesetzt. Waffe: zusätzlicher Feuerschaden. Stab: Elementarschaden. Rüstung, Schild oder Rucksack: weniger erlittener Feuerschaden. Die Stufe wird für den Gegenstand gewürfelt."
ecf_stone_gem_thor: "Thors Edelstein"
ecf_stone_gem_thor_desc: "Wird in einen Sockel gesetzt. Waffe: zusätzlicher Blitzschaden. Stab: Kettenblitz. Rüstung, Schild oder Rucksack: weniger erlittener Blitzschaden. Die Stufe wird für den Gegenstand gewürfelt."
ecf_stone_gem_tyr: "Tyrs Edelstein"
ecf_stone_gem_tyr_desc: "Wird in einen Sockel gesetzt. Waffe: mehr physischer Schaden. Stab: stärkere Beschwörungen. Rüstung, Schild oder Rucksack: weniger Taumeln. Die Stufe wird für den Gegenstand gewürfelt."
ecf_stone_gem_ymir: "Ymirs Edelstein"
ecf_stone_gem_ymir_desc: "Wird in einen Sockel gesetzt. Waffe: zusätzlicher Eisschaden. Stab: geringere Eitr-Kosten. Rüstung, Schild oder Rucksack: weniger erlittener Eisschaden. Die Stufe wird für den Gegenstand gewürfelt."
ecf_table_chisel_cuts: "schlägt Sockel in diesen Gegenstand: einer $1%, zwei $2%, drei $3%."
