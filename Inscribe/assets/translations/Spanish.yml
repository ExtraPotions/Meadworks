ecf_table_no_trophies: "Sin trofeos"
ecf_table_no_trophies_desc: "Los trofeos de criaturas que llevas se muestran aquí. Sacrificados en la mesa, cada uno añade esencia a su reserva: más cuanto más tardío es el bioma de la criatura, y más aún si es un jefe."
