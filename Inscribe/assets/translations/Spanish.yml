ecf_table_no_gear: "Sin equipo"
ecf_table_no_gear_desc: "Las armas, armaduras, escudos, herramientas y abalorios que llevas se muestran aquí. Elige uno, una runa y, si quieres, una esencia."
ecf_table_no_socket_gear: "Sin equipo"
ecf_table_no_socket_gear_desc: "Las armas, bastones, armaduras, escudos y mochilas que llevas se muestran aquí. Elige uno y después el Cincel dvergr o una gema que lleves."
