ecf_stone_dvergr_chisel: "Cincel dvergr"
ecf_stone_dvergr_chisel_desc: "Corta de uno a tres engastes en un arma, bastón, pieza de armadura, escudo o mochila que no tenga ninguno; dos o tres son más frecuentes en objetos Raros. Las gemas van en los engastes."
ecf_stone_gem_freyja: "Gema de Freyja"
ecf_stone_gem_freyja_desc: "Se engasta. Arma: robo de vida. Bastón: menor coste de salud. Armadura, escudo o mochila: más salud. Su nivel se tira para el objeto."
ecf_stone_gem_heimdall: "Gema de Heimdall"
ecf_stone_gem_heimdall_desc: "Se engasta. Arma: probabilidad de golpe crítico. Bastón: lanzamiento más rápido. Armadura, escudo o mochila: una probabilidad de evitar golpes. Su nivel se tira para el objeto."
ecf_stone_gem_hel: "Gema de Hel"
ecf_stone_gem_hel_desc: "Se engasta. Arma: daño de espíritu añadido. Bastón: Eitr al matar. Armadura, escudo o mochila: menos daño de espíritu recibido. Su nivel se tira para el objeto."
ecf_stone_gem_nidhogg: "Gema de Nidhogg"
ecf_stone_gem_nidhogg_desc: "Se engasta. Arma: daño de veneno añadido. Bastón: daño en el tiempo más largo. Armadura, escudo o mochila: menos daño de veneno recibido. Su nivel se tira para el objeto."
ecf_stone_gem_odin: "Gema de Odín"
ecf_stone_gem_odin_desc: "Se engasta. Arma: robo de Eitr. Bastón: regeneración de Eitr. Armadura, escudo o mochila: más Eitr. Su nivel se tira para el objeto."
ecf_stone_gem_skadi: "Gema de Skadi"
ecf_stone_gem_skadi_desc: "Se engasta. Arma: robo de vigor. Bastón: invocaciones más resistentes. Armadura, escudo o mochila: más vigor. Su nivel se tira para el objeto."
ecf_stone_gem_sleipnir: "Gema de Sleipnir"
ecf_stone_gem_sleipnir_desc: "Se engasta en armadura, escudo o mochila: movimiento más rápido. No cabe en armas ni bastones. Su nivel se tira para el objeto."
ecf_stone_gem_surtr: "Gema de Surtr"
ecf_stone_gem_surtr_desc: "Se engasta. Arma: daño de fuego añadido. Bastón: daño elemental. Armadura, escudo o mochila: menos daño de fuego recibido. Su nivel se tira para el objeto."
ecf_stone_gem_thor: "Gema de Thor"
ecf_stone_gem_thor_desc: "Se engasta. Arma: daño de rayo añadido. Bastón: cadena de rayos. Armadura, escudo o mochila: menos daño de rayo recibido. Su nivel se tira para el objeto."
ecf_stone_gem_tyr: "Gema de Tyr"
ecf_stone_gem_tyr_desc: "Se engasta. Arma: más daño físico. Bastón: invocaciones más fuertes. Armadura, escudo o mochila: menos tambaleo. Su nivel se tira para el objeto."
ecf_stone_gem_ymir: "Gema de Ymir"
ecf_stone_gem_ymir_desc: "Se engasta. Arma: daño de escarcha añadido. Bastón: menor coste de Eitr. Armadura, escudo o mochila: menos daño de escarcha recibido. Su nivel se tira para el objeto."
