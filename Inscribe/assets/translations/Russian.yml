ecf_stone_dvergr_chisel: "Двергрское долото"
ecf_stone_dvergr_chisel_desc: "Вырезает от одного до трёх гнёзд в оружии, посохе, части брони, щите или рюкзаке без гнёзд. Два или три чаще выпадают на Редких предметах. Самоцветы входят в гнёзда."
ecf_stone_gem_freyja: "Самоцвет Фрейи"
ecf_stone_gem_freyja_desc: "Вставляется в гнездо. Оружие: похищение жизни. Посох: меньший расход здоровья. Броня, щит или рюкзак: больше здоровья. Ранг выпадает для предмета."
ecf_stone_gem_heimdall: "Самоцвет Хеймдалля"
ecf_stone_gem_heimdall_desc: "Вставляется в гнездо. Оружие: шанс критического удара. Посох: более быстрое чтение. Броня, щит или рюкзак: шанс избежать ударов. Ранг выпадает для предмета."
ecf_stone_gem_hel: "Самоцвет Хель"
ecf_stone_gem_hel_desc: "Вставляется в гнездо. Оружие: дополнительный урон духом. Посох: эйтр при убийстве. Броня, щит или рюкзак: меньше получаемого урона духом. Ранг выпадает для предмета."
ecf_stone_gem_nidhogg: "Самоцвет Нидхёгга"
ecf_stone_gem_nidhogg_desc: "Вставляется в гнездо. Оружие: дополнительный урон ядом. Посох: более долгий урон со временем. Броня, щит или рюкзак: меньше получаемого урона ядом. Ранг выпадает для предмета."
ecf_stone_gem_odin: "Самоцвет Одина"
ecf_stone_gem_odin_desc: "Вставляется в гнездо. Оружие: похищение эйтра. Посох: восстановление эйтра. Броня, щит или рюкзак: больше эйтра. Ранг выпадает для предмета."
ecf_stone_gem_skadi: "Самоцвет Скади"
ecf_stone_gem_skadi_desc: "Вставляется в гнездо. Оружие: похищение выносливости. Посох: более крепкие призывы. Броня, щит или рюкзак: больше выносливости. Ранг выпадает для предмета."
ecf_stone_gem_sleipnir: "Самоцвет Слейпнира"
ecf_stone_gem_sleipnir_desc: "Вставляется в гнездо брони, щита или рюкзака: более быстрое движение. Не подходит оружию и посохам. Ранг выпадает для предмета."
ecf_stone_gem_surtr: "Самоцвет Сурта"
ecf_stone_gem_surtr_desc: "Вставляется в гнездо. Оружие: дополнительный урон огнем. Посох: стихийный урон. Броня, щит или рюкзак: меньше получаемого урона огнем. Ранг выпадает для предмета."
ecf_stone_gem_thor: "Самоцвет Тора"
ecf_stone_gem_thor_desc: "Вставляется в гнездо. Оружие: дополнительный урон молнией. Посох: цепная молния. Броня, щит или рюкзак: меньше получаемого урона молнией. Ранг выпадает для предмета."
ecf_stone_gem_tyr: "Самоцвет Тюра"
ecf_stone_gem_tyr_desc: "Вставляется в гнездо. Оружие: больше физического урона. Посох: более сильные призывы. Броня, щит или рюкзак: меньше оглушения. Ранг выпадает для предмета."
ecf_stone_gem_ymir: "Самоцвет Имира"
ecf_stone_gem_ymir_desc: "Вставляется в гнездо. Оружие: дополнительный урон льдом. Посох: меньший расход эйтра. Броня, щит или рюкзак: меньше получаемого урона льдом. Ранг выпадает для предмета."
