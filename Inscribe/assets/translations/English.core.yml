ecf_ui_category_defense: "Defense"
ecf_ui_category_utility: "Utility"
ecf_ui_slot_melee_weapon: "Melee weapon"
ecf_ui_slot_ranged_weapon: "Ranged weapon"
ecf_ui_slot_magic_weapon: "Magic weapon"
ecf_ui_slot_shield: "Shield"
ecf_ui_slot_head: "Head"
ecf_ui_slot_chest: "Chest"
ecf_ui_slot_legs: "Legs"
ecf_ui_slot_cape: "Cape"
ecf_ui_slot_utility_item: "Utility item"
ecf_ui_slot_tool: "Tool"

