# EliteCrafting - English words shared by every feature (localization.md section 2).
# Key without the $ -> text. $1, $2 are the game's placeholders.
# Each feature area keeps its own words in its own English.<area>.yml next to this file.

# rarities
ecf_rarity_normal: "Normal"
ecf_rarity_magic: "Magic"
ecf_rarity_rare: "Rare"

# tooltip vocabulary
ecf_ui_affix_line: "$1 $2"
ecf_ui_tier: "T$1"
ecf_ui_range: "[$1-$2]"
ecf_ui_dormant: "(dormant)"
ecf_ui_unreadable: "Unreadable: $1"
ecf_ui_newer_format: "Changed by a newer version of EliteCrafting"

