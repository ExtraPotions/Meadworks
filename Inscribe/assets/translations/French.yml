ecf_stone_dvergr_chisel: "Ciseau dvergr"
ecf_stone_dvergr_chisel_desc: "Taille une à trois châsses dans une arme, un bâton, une pièce d'armure, un bouclier ou un sac à dos qui n'en a aucune ; deux ou trois sont plus fréquents sur les objets Rares. Les gemmes vont dans les châsses."
ecf_stone_gem_freyja: "Gemme de Freyja"
ecf_stone_gem_freyja_desc: "Sertie dans une châsse. Arme : vol de vie. Bâton : coût en vie plus bas. Armure, bouclier ou sac à dos : plus de vie. Son rang est tiré pour l'objet."
ecf_stone_gem_heimdall: "Gemme de Heimdall"
ecf_stone_gem_heimdall_desc: "Sertie dans une châsse. Arme : chance de coup critique. Bâton : incantation plus rapide. Armure, bouclier ou sac à dos : une chance d'éviter les coups. Son rang est tiré pour l'objet."
ecf_stone_gem_hel: "Gemme de Hel"
ecf_stone_gem_hel_desc: "Sertie dans une châsse. Arme : dégâts d'esprit ajoutés. Bâton : Eitr à la mise à mort. Armure, bouclier ou sac à dos : moins de dégâts d'esprit subis. Son rang est tiré pour l'objet."
ecf_stone_gem_nidhogg: "Gemme de Nidhogg"
ecf_stone_gem_nidhogg_desc: "Sertie dans une châsse. Arme : dégâts de poison ajoutés. Bâton : dégâts sur la durée plus longs. Armure, bouclier ou sac à dos : moins de dégâts de poison subis. Son rang est tiré pour l'objet."
ecf_stone_gem_odin: "Gemme d'Odin"
ecf_stone_gem_odin_desc: "Sertie dans une châsse. Arme : vol d'Eitr. Bâton : régénération d'Eitr. Armure, bouclier ou sac à dos : plus d'Eitr. Son rang est tiré pour l'objet."
ecf_stone_gem_skadi: "Gemme de Skadi"
ecf_stone_gem_skadi_desc: "Sertie dans une châsse. Arme : vol d'endurance. Bâton : invocations plus robustes. Armure, bouclier ou sac à dos : plus d'endurance. Son rang est tiré pour l'objet."
ecf_stone_gem_sleipnir: "Gemme de Sleipnir"
ecf_stone_gem_sleipnir_desc: "Sertie dans une châsse d'armure, de bouclier ou de sac à dos : déplacement plus rapide. Elle ne va pas sur les armes ni les bâtons. Son rang est tiré pour l'objet."
ecf_stone_gem_surtr: "Gemme de Surtr"
ecf_stone_gem_surtr_desc: "Sertie dans une châsse. Arme : dégâts de feu ajoutés. Bâton : dégâts élémentaires. Armure, bouclier ou sac à dos : moins de dégâts de feu subis. Son rang est tiré pour l'objet."
ecf_stone_gem_thor: "Gemme de Thor"
ecf_stone_gem_thor_desc: "Sertie dans une châsse. Arme : dégâts de foudre ajoutés. Bâton : chaîne de foudre. Armure, bouclier ou sac à dos : moins de dégâts de foudre subis. Son rang est tiré pour l'objet."
ecf_stone_gem_tyr: "Gemme de Tyr"
ecf_stone_gem_tyr_desc: "Sertie dans une châsse. Arme : plus de dégâts physiques. Bâton : invocations plus fortes. Armure, bouclier ou sac à dos : moins de déséquilibre. Son rang est tiré pour l'objet."
ecf_stone_gem_ymir: "Gemme d'Ymir"
ecf_stone_gem_ymir_desc: "Sertie dans une châsse. Arme : dégâts de glace ajoutés. Bâton : coût d'Eitr plus bas. Armure, bouclier ou sac à dos : moins de dégâts de gel subis. Son rang est tiré pour l'objet."
